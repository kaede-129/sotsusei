<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js GLTF Viewer</title>
    <style>
        .menu {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
}

/* 三本線のボタン */
.menu-btn {
    width: 50px;
    height: 50px;
    background: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
}

.menu-btn span {
    width: 22px;
    height: 2px;
    background: #333;
    transition: 0.3s;
}

/* メニューの中身 */
.menu-list {
    display: none;
    flex-direction: column;
    gap: 20px;

    position: absolute;
    top: 60px;
    right: 0;

    width: 150px;
    padding: 20px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 12px #0002;
}

.menu-list a {
    color: #333;
    text-decoration: none;
    font-size: 14px;
}

/* 開いたとき */
.menu-list.active {
    display: flex;
}
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* スクロールバーを非表示にする */
            background :linear-gradient(
                to bottom,
                #91c9f5 0%,
                #d8eaff 55%,
                #f0caee 100%
            );
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 20px;
            pointer-events: none; /* クリックイベントを透過 */
            transition: opacity 0.5s;
        }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div class="menu">
    <button id="menu-btn" class="menu-btn">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="menu-list" class="menu-list">
        <a href="#home">HOME</a>
        <a href="#about">ABOUT</a>
        <a href="#works">WORKS</a>
    </nav>
</div>

    <div id="loading">モデルを読み込み中...</div>
    <div id="canvas-container"></div>

    <script type="module">
        const menuBtn = document.getElementById("menu-btn");
        const menuList = document.getElementById("menu-list");

        menuBtn.addEventListener("click", () => {
            menuList.classList.toggle("active");
        });


        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. 基本設定（シーン、カメラ、レンダラー） ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = scene.background = null;

        // パースペクティブカメラの設定（画角、アスペクト比、ニア・ファープレーン）
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 25); // カメラの初期位置（少し上から見下ろす）

        // WebGLレンダラーの設定
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
         }); // アンチエイリアスを有効化
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Retinaディスプレイ等の解像度対策（上限2）
        renderer.shadowMap.enabled = true; // シャドウ（影）の描画を有効化
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // リアルな色合いにするためのトーンマッピング
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        // --- 2. ライト（照明）の設定 ---
        // 環境光（全体を均等に照らす）
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        // 平行光源（太陽光のような直進する光）
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true; // 影を落とす
        dirLight.shadow.mapSize.width = 2048; // 影の解像度
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        const d = 15; // 影のカメラの範囲
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        dirLight.shadow.bias = -0.0001;
        dirLight.shadow.normalBias = 0.02;
        dirLight.shadow.mapSize.set(2048, 2048);

        // --- 3. コントロール（マウス操作） ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 操作のスムーズな減衰（慣性）を有効化
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // 地面以下にカメラが潜らないように制限

        // --- 4. GLTFモデルの読み込み ---
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath(
            'https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/'
        );

        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        const loadingEl = document.getElementById('loading');

        // ※ `TerrainWater01.glb` はこのHTMLファイルと同じディレクトリに配置してください
        const modelUrl = './tableset_compressed.glb'; 

        loader.load(
            modelUrl,
            (gltf) => {
                const model = gltf.scene;

                // モデル内のメッシュの影を設定
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        if (child.material) {
                            child.material.depthWrite = true;
                        }

                        // 名前に「ラグ」が含まれるオブジェクトは影を受けない
                        if (child.name.includes("Circle")) {
                            child.receiveShadow = false;
                        }
                        if (child.name.includes("BézierCurve")) {
                            child.receiveShadow = false;
                        }
                    }
                });

                // モデルのサイズや位置を自動調整して画面中央に配置
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                // 位置を原点（0,0,0）にリセット
                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - box.min.y); // 地面（y=0）に接地させる
                model.position.z += (model.position.z - center.z);

                scene.add(model);

                // カメラのターゲットをモデルの中心に設定
                controls.target.set(0, size.y / 2, 0);
                controls.update();

                // ローディング表示を消す
                loadingEl.style.opacity = 0;
                setTimeout(() => loadingEl.remove(), 500);
            },
            (xhr) => {
                // 読み込み進捗のログ（必要に応じて％表示などに利用可能）
                if (xhr.total > 0) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingEl.innerText = `モデルを読み込み中... (${percent}%)`;
                }
            },
            (error) => {
                console.error('モデルの読み込みに失敗しました:', error);
                loadingEl.innerText = 'モデルの読み込みエラーが発生しました。';
                loadingEl.style.color = '#ff6b6b';
            }
        );

        // --- 5. ウィンドウサイズ変更への追従 ---
        window.addEventListener('resize', onWindowResize);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 6. アニメーションループ（描画の更新） ---
        function animate() {
            requestAnimationFrame(animate);

            // コントロールの更新（慣性エフェクトに必要）
            controls.update();

            // レンダリング
            renderer.render(scene, camera);
        }

        // ループを開始
        animate();
    </script>
</body>
</html>
